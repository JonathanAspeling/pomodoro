<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="top-nav">
    <button id="menu-button" class="menu-button" aria-label="Menu">&#9776;</button>
  </nav>

  <main class="timer-stage">
    <div class="tick-ring" id="tick-ring"></div>
    <div class="clock-face">
      <div class="outer-ring">
        <div id="time-circle" class="inner-circle">
          <button id="play-button" class="play-button" aria-label="Play">&#9654;</button>
        </div>
      </div>
    </div>
    <div class="dot-selectors">
      <div class="dots dot-group" data-count="4">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <div class="dots dot-group" data-count="4">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </div>
    <p class="session-label"><span id="session-type">POMODORO</span> <span id="session-duration">25 MIN</span></p>
  </main>

  <div id="settings-panel" class="settings-panel hidden">
    <h3>Customize Durations (minutes)</h3>
    <label>Focus: <input id="setting-focus" type="number" min="1" max="60" value="25"></label>
    <label>Short Break: <input id="setting-short" type="number" min="1" max="60" value="5"></label>
    <label>Long Break: <input id="setting-long" type="number" min="1" max="60" value="15"></label>
    <div class="settings-actions">
      <button id="settings-save">Save</button>
      <button id="settings-cancel">Cancel</button>
    </div>
    <p id="settings-error" class="settings-error hidden"></p>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
